<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diretrizes para a Gestão de Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-apple-touch.png">
<meta name="theme-color" content="#B91D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão de Projetos">
<style>
.auth-topbar{position:fixed;top:0;left:0;right:0;background:#0F0F0F;color:#fff;font-size:11.5px;padding:8px 18px;display:flex;align-items:center;gap:10px;z-index:150;font-family:'Montserrat',sans-serif}
.auth-topbar b{font-weight:700}
.auth-topbar .papel-tag{background:#B91D2E;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.auth-topbar .sair{margin-left:auto;background:none;border:none;color:#fff;opacity:.7;cursor:pointer;font-size:11px;text-decoration:underline;font-family:inherit}
.auth-topbar .sair:hover{opacity:1}
.auth-topbar .push-btn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;padding:3px 10px;border-radius:999px;cursor:pointer;font-size:10.5px;font-family:inherit}
.auth-topbar .push-btn:hover{background:rgba(255,255,255,.12)}
.auth-topbar .push-btn.ativo{border-color:#1B7F4B;background:rgba(27,127,75,.25)}
body.auth-ready{padding-top:34px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="push-notifications.js?v=1"></script>
<script>
/* Captura o token de login caso o Supabase redirecione a confirmação de e-mail para esta página (raiz), em vez do formulário de origem. */
(function(){
  if (location.hash && location.hash.indexOf('access_token') > -1) {
    var params = new URLSearchParams(location.hash.slice(1));
    if (params.get('access_token')) {
      localStorage.setItem('unialfa_session', JSON.stringify({
        access_token: params.get('access_token'),
        refresh_token: params.get('refresh_token'),
        expires_at: Date.now() + (parseInt(params.get('expires_in')||'3600',10)*1000),
      }));
      if (params.get('provider_token')) { localStorage.setItem('unialfa_provider_token', params.get('provider_token')); }
      var voltarPara = localStorage.getItem('unialfa_login_return_to');
      localStorage.removeItem('unialfa_login_return_to');
      if (voltarPara && voltarPara.split('#')[0] !== location.href.split('#')[0]) {
        location.replace(voltarPara + location.hash);
        return;
      }
      history.replaceState(null, '', location.pathname + location.search);
      document.addEventListener('DOMContentLoaded', function(){
        var b = document.createElement('div');
        b.textContent = 'Login confirmado! Clique em qualquer formulário no mapa para continuar.';
        b.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#1B7F4B;color:#fff;padding:10px 18px;font:600 13px Montserrat,sans-serif;text-align:center;z-index:999';
        document.body.prepend(b);
        setTimeout(function(){ b.remove(); }, 7000);
      });
    }
  }
})();

/* Mostra quem está logado (se houver sessão), sem exigir login para ver o mapa — acesso continua livre. */
(function(){
  var IS_TREINO = location.href.indexOf('treino')>-1;
  var SUPABASE_URL = IS_TREINO ? 'https://uuxvdulunrwppbmofyux.supabase.co' : 'https://fiarntunpqteopwjkhjg.supabase.co';
  var SUPABASE_ANON_KEY = IS_TREINO ? 'sb_publishable_c2t1YzuGTrNvg5770BYOvg_04hR9NrE' : 'sb_publishable_RO-UPexCYhZ0rVZiIYWunA_a7YqodnQ';
  var PAPEL_LABEL = {
    solicitante: 'Solicitante', gerente_projetos: 'Gerente de Projetos', gestor_responsavel: 'Gestor Responsável',
    dono_negocio: 'Dono do Negócio', alta_gestao: 'Alta Gestão', admin: 'PMO / Admin',
  };
  function getSession(){ try{ return JSON.parse(localStorage.getItem('unialfa_session')); }catch(e){ return null; } }
  async function mostrarTopbar(){
    var s = getSession();
    if(!s || !s.access_token) return;
    if (s.expires_at && Date.now() > s.expires_at) { localStorage.removeItem('unialfa_session'); return; }
    var r = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + s.access_token } });
    if(!r.ok) return;
    var user = await r.json();
    var pr = await fetch(SUPABASE_URL + '/rest/v1/perfis?id=eq.' + user.id + '&select=papel', { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + s.access_token } });
    var rows = pr.ok ? await pr.json() : [];
    var papel = rows[0] ? rows[0].papel : 'solicitante';
    document.body.classList.add('auth-ready');
    var bar = document.createElement('div');
    bar.className='auth-topbar';
    bar.innerHTML = '<span>Conectado como <b>'+ (user.email||'') +'</b></span><span class="papel-tag">'+(PAPEL_LABEL[papel]||papel)+'</span><button class="push-btn" id="pushBtn">🔔 Lembretes no celular</button><button class="sair" onclick="localStorage.removeItem(\'unialfa_session\');location.reload();">Sair</button>';
    document.body.prepend(bar);
    if (window.unialfaPush) configurarBotaoPush(user.email, s.access_token);
  }
  async function configurarBotaoPush(email, accessToken){
    var btn = document.getElementById('pushBtn');
    async function atualizar(){
      var st = await window.unialfaPush.status();
      if(st==='ativo'){ btn.textContent='🔔 Lembretes ativos'; btn.classList.add('ativo'); btn.disabled=false; }
      else if(st==='negado'){ btn.textContent='🔕 Notificações bloqueadas'; btn.disabled=true; }
      else if(st==='indisponivel'){ btn.textContent='🔕 Indisponível neste navegador'; btn.disabled=true; }
      else if(st==='precisa_instalar_ios'){ btn.textContent='🔔 Ativar (adicione à Tela de Início)'; btn.classList.remove('ativo'); btn.disabled=false; }
      else { btn.textContent='🔔 Ativar lembretes no celular'; btn.classList.remove('ativo'); btn.disabled=false; }
      return st;
    }
    var estadoAtual = await atualizar();
    btn.addEventListener('click', async function(){
      try{
        if(estadoAtual==='ativo'){ await window.unialfaPush.desativar(accessToken); }
        else { await window.unialfaPush.ativar(email, accessToken); }
      }catch(err){ alert(err.message || 'Não foi possível ativar as notificações.'); }
      estadoAtual = await atualizar();
    });
  }
  document.addEventListener('DOMContentLoaded', mostrarTopbar);
})();
</script>
<script src="app-data.js?v=6"></script>
<script src="app.js?v=46"></script>
</body>
</html>
